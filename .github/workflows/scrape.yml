name: Scrape lucky numbers

# Security note: this workflow uses NO untrusted event inputs (no
# github.event.* interpolation) — triggers are cron + manual dispatch only.

on:
  schedule:
    # Every 6h — articles ramp up D-7 before each draw (1st/16th).
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape sources
        run: node scrape.mjs

      - name: Commit if content changed
        run: |
          # lucky-numbers.json carries generatedAt (changes every run);
          # .content-hash excludes it, so we only commit on real changes.
          if ! git diff --quiet data/.content-hash; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update lucky numbers ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No content change — skipping commit."
          fi
